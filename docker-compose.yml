services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: growth
      POSTGRES_PASSWORD: growth
      POSTGRES_DB: growthcognix
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth -d growthcognix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ./backend
    env_file: ./backend/.env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    volumes: [uploads:/data/uploads]
    ports: ["8000:8000"]

  worker:
    build: ./backend
    env_file: ./backend/.env
    command: rq worker --url redis://redis:6379/0 growthcognix
    depends_on: [redis, db]

  # Phase 3: queues scheduled website/competitor re-crawls once an hour
  scheduler:
    build: ./backend
    env_file: ./backend/.env
    command: sh -c "while true; do python -m app.services.web.scheduler; sleep 3600; done"
    depends_on: [redis, db]

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_DATA_MODE: api
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  uploads:
